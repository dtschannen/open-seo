# Authelia in front of OpenSEO: one local user (users.yml), password + TOTP.
# Secrets come from /secrets via the *_FILE variables in compose.yaml.
# Served under https://seo.lemon-score.ch/authelia, so the session cookie stays
# on that one host and never reaches hub/club.lemon-score.ch.

theme: auto

server:
  address: tcp://0.0.0.0:9091/authelia

log:
  level: info

totp:
  issuer: LemonScore SEO
  algorithm: SHA1
  digits: 6
  period: 30
  skew: 1
  secret_size: 32

webauthn:
  disable: true

identity_validation:
  reset_password:
    # Set by AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE.
    jwt_lifespan: 5m

authentication_backend:
  password_reset:
    disable: true
  password_change:
    disable: true
  file:
    path: /config/users.yml
    watch: false
    password:
      algorithm: argon2

# Nothing passes on one factor: anything not listed is denied.
access_control:
  default_policy: deny
  rules:
    - domain: seo.lemon-score.ch
      policy: two_factor

session:
  name: openseo_session
  same_site: lax
  inactivity: 2h
  expiration: 12h
  remember_me: 14d
  cookies:
    - domain: seo.lemon-score.ch
      authelia_url: https://seo.lemon-score.ch/authelia
      default_redirection_url: https://seo.lemon-score.ch/

# 5 wrong logins within 10 minutes ban the user for an hour.
regulation:
  modes:
    - user
    - ip
  max_retries: 5
  find_time: 10m
  ban_time: 1h

storage:
  local:
    path: /data/db.sqlite3

# Only used for identity checks (e.g. registering another TOTP device in the
# portal). Read the code on the server: cat ~/open-seo/authelia/data/notification.txt
notifier:
  disable_startup_check: true
  filesystem:
    filename: /data/notification.txt

ntp:
  disable_startup_check: true

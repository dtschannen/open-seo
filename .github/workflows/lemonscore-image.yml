name: LemonScore image

# Builds deploy/lemonscore/Dockerfile (vite build baked in, non-root) for the
# LemonScore server and pushes ghcr.io/dtschannen/open-seo:<sha> and :latest.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: github.repository == 'dtschannen/open-seo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/lemonscore/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/dtschannen/open-seo:${{ github.sha }}
            ghcr.io/dtschannen/open-seo:latest
          labels: |
            org.opencontainers.image.source=https://github.com/dtschannen/open-seo
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
